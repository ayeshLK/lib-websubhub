coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
        if_ci_failed: error
    patch:
      default:
        target: 85%
        threshold: 0%
        informational: false
        if_ci_failed: error

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
