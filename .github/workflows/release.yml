name: Release prepared Go module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release prepared version
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - name: Read and validate prepared version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -er '.["."] | select(type == "string")' .release-please-manifest.json)"
          if [[ ! "$VERSION" =~ ^0\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Prepared release must be a valid v0 semantic version" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; merge the next release PR first" >&2
            exit 1
          fi
          if ! awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $VERSION" >&2
            exit 1
          fi
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify core
        run: |
          test "$(go list -m all | wc -l)" -eq 1
          go vet ./...
          go test -race ./...
          go test -covermode=atomic -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 85) exit 1 }'
      - name: Verify example
        working-directory: examples/in-memory-websubhub
        run: |
          go vet ./...
          go test -race ./...
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$(git rev-parse HEAD)" --notes-file release-notes.md --title "$TAG"
